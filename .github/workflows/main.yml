name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Create Identity
        run: node scripts/createNewIdentity.js

      - name: Link Identity
        run: node scripts/manualLinkHumanToAgent.js --challenge '{"name":"keso1234","description":"keso1234 AI Agent"}'
