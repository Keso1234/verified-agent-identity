jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - run: npm install

      - run: npx --yes clihub@latest install verified-agent-identity

      - run: node scripts/createNewIdentity.js

      - run: node scripts/humanLinkHumanToAgent.js --challenge '{"name":"kesto1234"}'
