name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'kesto1234'
        required: true
        default: 'kesto1234'
      agent_description:
        description: 'kesto1234'
        required: true
        default: 'KES01234 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install CliHub skill
        run: npm ci --save   # ⚠️ This command may not be correct—see notes below

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewIdentity.js

      - name: Step 3 - Link Human to Agent
        run: node scripts/humanLinkHumanToAgent.js --challenge '{"name":"kesto1234"}'
